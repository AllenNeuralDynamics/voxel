router_server_kwargs:
  rpc_port: 5555
  broadcast_port: 5556
router_server_api:
  named_calls:
    seqsweep_start:
      obj_name: "seqsweep"
      attr_name: "start_run"
    seqsweep_pause:
      obj_name: "seqsweep"
      attr_name: "pause"
    seqsweep_resume:
      obj_name: "seqsweep"
      attr_name: "resume_run"
    seqsweep_reset:
      obj_name: "seqsweep"
      attr_name: "reset"
    seqsweep_get_job:
      obj_name: "seqsweep"
      attr_name: "get_job"
    seqsweep_check_job_status:
      obj_name: "seqsweep"
      attr_name: "check_job_status"

# hal: the hardware blueprint (SeqSweepHardwareTopology) — rigup devices/nodes plus the role each device plays.
hal:
  devices:
    acs:
      target: seqsweep.devices.acs.simulated_acs.SimulatedAcsController
      init:
        gate_outputs:
          laser_532: OUT0
        time_scale: 1.0
  scan_controller: acs
  # TODO: nodes (WS2/WS3 cameras over tcp://), cameras, lasers, z_axis roles

# default: the baseline run settings (SeqSweepDefaults) — one strip pass and how many times to run it.
default:
  scan:
    start_um: 0
    end_um: 2000
    velocity_um_s: 10000
    line_pitch_um: 0.5
    lasers: [laser_532]
  passes: 2
