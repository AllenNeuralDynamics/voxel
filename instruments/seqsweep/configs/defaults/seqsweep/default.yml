router_server_kwargs:
  rpc_port: 5555
  broadcast_port: 5556
router_server_api:
  named_calls:
    seqsweep_start_acquisition:
      obj_name: "seqsweep"
      attr_name: "start_acquisition"
    seqsweep_pause:
      obj_name: "seqsweep"
      attr_name: "pause"
    seqsweep_resume:
      obj_name: "seqsweep"
      attr_name: "resume_run"
    seqsweep_reset:
      obj_name: "seqsweep"
      attr_name: "reset"
    seqsweep_get_job:
      obj_name: "seqsweep"
      attr_name: "get_job"
    seqsweep_check_job_status:
      obj_name: "seqsweep"
      attr_name: "check_job_status"

# hal: the hardware blueprint (SeqSweepHardwareTopology) — rigup devices/nodes plus the role each device plays.
hal:
  devices:
    acs:
      target: seqsweep.devices.acs.simulated_acs.SimulatedAcsController
      init:
        gate_outputs:
          laser_532: OUT0
        time_scale: 1.0
  scan_controller: acs
  # TODO: nodes (WS2/WS3 cameras over tcp://), cameras, lasers, z_axis roles, scan limits

# default: baseline run settings (SeqSweepInstrumentDefaults). TODO: scan velocity, line pitch, lasers, passes.
default: {}
