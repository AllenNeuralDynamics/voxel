router_server_kwargs:
  rpc_port: 5555
  broadcast_port: 5556
router_server_api:
  named_calls:
    seqsweep_start_acquisition:
      obj_name: "seqsweep"
      attr_name: "start_acquisition"
    seqsweep_pause:
      obj_name: "seqsweep"
      attr_name: "pause"
    seqsweep_resume:
      obj_name: "seqsweep"
      attr_name: "resume_run"
    seqsweep_reset:
      obj_name: "seqsweep"
      attr_name: "reset"
    seqsweep_get_job:
      obj_name: "seqsweep"
      attr_name: "get_job"
    seqsweep_check_job_status:
      obj_name: "seqsweep"
      attr_name: "check_job_status"
    seqsweep_stage_move_to:
      obj_name: "seqsweep"
      attr_name: "stage_move_to"
    seqsweep_stage_move_by:
      obj_name: "seqsweep"
      attr_name: "stage_move_by"
    seqsweep_stage_go_home:
      obj_name: "seqsweep"
      attr_name: "stage_go_home"
    seqsweep_stage_wait_motion_end:
      obj_name: "seqsweep"
      attr_name: "stage_wait_motion_end"
    seqsweep_stage_status:
      obj_name: "seqsweep"
      attr_name: "stage_status"

# hal: the hardware blueprint (SeqSweepHardwareTopology) - rigup devices/nodes plus the role each device plays.
# Stage values (mm, mm/s) come from "Stage buffer_062226.txt".
hal:
  devices:
    acs:
      target: seqsweep.devices.scan_controller.acs.AcsController
      init:
        communication_option: simulator  # ethernet_tcp | simulator (SPiiPlus stand-alone simulator; address and port unused)
        address: 10.0.0.100
        port: 701
        axis_x: 0
        axis_y: 1
        scan_buffer: 4  # TODO: confirm this program buffer is free; the scan pass is loaded into it on connect
        line_pulse_width_ms: 0.001
        scan_accel: 6000
        scan_decel: 6000
        move_velocity_mm_s: 50  # positioning moves, not scans
        origin_mm: [155.0, 155.0]
        limits_mm:
          x: [20, 290]
          y: [20, 290]
  scan_controller: acs
  # TODO: nodes (WS2/WS3 cameras over tcp://), cameras, lasers, z_axis roles

# default: baseline run settings (SeqSweepInstrumentDefaults). TODO: lasers, passes.
default:
  # scan_axis: stage axis the scan runs along. If it changes (camera rotated), re-check optics, scan_safe_range_mm
  # and chambers_step_mm, which are given along the scan axis and across it.
  scan_axis: x
  optics:
    tdi_pixel_um: 5.0
    magnification: 20
    tdi_image_width_px: 4352  # sensor width, steps of 32, max 16384; must match the camera and frame grabber
  chamber_edge_margin_mm: 10  # clearance between the safe X range and the chamber edge; a job's scan_margin_mm must fit in it
  chambers_step_mm:  # lower edge of each chamber across the scan (Y while scan_axis is x); strips step upward from it
    1: 200.25
    2: 155.0
    3: 109.75   
  scan_safe_range_mm: [125.0, 178.75]  # TODO confirm with Miki; set to the imaged range of "Stage buffer_112026.txt"
  max_line_rate_hz: 470000 # camera limit; keep in step with the camera .cpp config
