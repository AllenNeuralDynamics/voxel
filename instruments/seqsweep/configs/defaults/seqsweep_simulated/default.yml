router_server_kwargs:
  rpc_port: 5555
  broadcast_port: 5556
router_server_api:
  named_calls:
    seqsweep_start_acquisition:
      obj_name: "seqsweep"
      attr_name: "start_acquisition"
    seqsweep_pause:
      obj_name: "seqsweep"
      attr_name: "pause"
    seqsweep_resume:
      obj_name: "seqsweep"
      attr_name: "resume_run"
    seqsweep_reset:
      obj_name: "seqsweep"
      attr_name: "reset"
    seqsweep_get_job:
      obj_name: "seqsweep"
      attr_name: "get_job"
    seqsweep_check_job_status:
      obj_name: "seqsweep"
      attr_name: "check_job_status"

# hal: the hardware blueprint (SeqSweepHardwareTopology) - rigup devices/nodes plus the role each device plays.
hal:
  devices:
    acs:
      target: seqsweep.devices.scan_controller.simulated.SimulatedScanController
      init:
        gate_outputs:
          laser_532: OUT0
        time_scale: 1.0
  scan_controller: acs
  # TODO: nodes (WS2/WS3 cameras over tcp://), cameras, lasers, z_axis roles

# default: baseline run settings (SeqSweepInstrumentDefaults). TODO: lasers, passes.
default:
  optics:
    tdi_pixel_um: 5.0
    magnification: 20
    tdi_image_width_px: 480  # sensor width, steps of 32, max 16384
    overscan_px: 200  # lead-in/out distance in pixels; must fit in chamber_edge_margin_mm
  chamber_edge_margin_mm: 10  # clearance between the safe X range and the chamber edge
  chambers_y_mm:
    1: 200.25
    2: 155.0
    3: 109.75
  x_safe_range_mm: [116.75, 173.25]  # 10 mm margin from chamber edges
  max_line_rate_hz: 10000  # camera limit; keep in step with the camera .cpp config
