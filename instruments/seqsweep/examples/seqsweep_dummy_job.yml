# Values from "Stage buffer_112026.txt" (mm, as in the buffer).
name: "Chambers 1 and 3"
chambers: [1, 3]  # scanned in this order; each resolves to its lower Y edge from default.chambers_step_mm
direction: forward
num_strips: 5  # passes or frames per chamber
pass_config:
  scan_start_mm: 125.0  # X0
  scan_end_mm: 178.75  # X_end
  scan_margin_mm: 6.0  # MARGIN: run-up and run-out at each end; travel = capture + 2 x margin
  step_margin_mm: 8.33  # chamber lower edge to first strip; Y0 118.08 - chamber 3 edge 109.75 (applies to every chamber)
  line_rate_hz: 470000  # camera line rate; pixel pitch and stage speed follow from the optics
  lasers: [laser_532]
