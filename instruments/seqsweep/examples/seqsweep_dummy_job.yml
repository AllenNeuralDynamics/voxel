# Values from "Stage buffer_112026.txt" (mm in the buffer, um here).
name: "Chambers 1 and 3"
chambers: [1, 3]  # scanned in this order; each resolves to its lower Y edge from default.chambers_step_mm
step_margin_um: 8330  # chamber lower edge to first strip; Y0 118.08 - chamber 3 edge 109.75 (applies to every chamber)
direction: forward
num_strips: 5  # passes or frames per chamber
pass_config:
  scan_start_um: 125000  # X0
  scan_end_um: 178750  # X_end
  scan_margin_um: 6000  # MARGIN (6 mm): run-up and run-out at each end; travel = capture + 2 x margin
  line_rate_hz: 470000  # camera line rate; pixel pitch and stage speed follow from the optics
  lasers: [laser_532]
