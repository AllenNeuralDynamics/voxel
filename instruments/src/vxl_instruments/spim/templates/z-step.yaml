# A Z-step light sheet like exaSPIM, on simulated drivers: it opens on any computer.
# 1 camera. Each frame: ao_main plays 1 cycle on its own clock, the camera takes the frame, and Z steps 1 spacing.
# To run real hardware, swap each device's target for its driver (see exaspim-v1.yaml for a real exaSPIM).
#
# What each part of the file says, top to bottom:
#   parts          things with no driver: kind says what each is. A filter has its band, an objective its magnification.
#   devices        things with a driver: target names the driver's class, init its settings.
#   rig.optics     where the light goes, from the light sources through the specimen to the cameras.
#   rig.scan       the axis that 1 capture moves, step or sweep, and what sets the rhythm. The rest follows from the wires.
#   default        what a new instrument starts with: task defaults, positions and profiles.
#   a profile      channels by name, each with its cameras and their lights, positions, powers, timelines, spacing.
#   a timeline     only the wires it plays. A wire with no signal stays at rest: off for a digital wire, park for an analog wire.

rig:
  model: z-step light sheet
  target: vxl_instruments.spim.Microscope

  parts:                                          # things with no driver: their facts, and their class when it is not rigup.Part
    combiner:           {kind: combiner}
    left_tunable_lens:  {kind: tunable_lens}
    right_tunable_lens: {kind: tunable_lens}
    positive_galvo:     {kind: galvo}
    negative_galvo:     {kind: galvo}
    objective:          {target: vxl.parts.Objective, magnification: 5.0}   # the objective and the tube lens together
    BP525:              {target: vxl.parts.Filter, band: [500 nm, 550 nm]}
    BP600:              {target: vxl.parts.Filter, band: [575 nm, 625 nm]}
    BP700:              {target: vxl.parts.Filter, band: [663 nm, 737 nm]}

  wiring: &wiring                                 # every wire on the bench, grouped by the device that sends it
    ao_main:
      camera_trigger: {pin: ao21, to: [camera/trigger_in],     kind: digital, off: 0 V, on: 5 V}
      laser_488:      {pin: ao17, to: [laser_488/ttl_in],      kind: digital, off: 0 V, on: 5 V}
      laser_561:      {pin: ao13, to: [laser_561/ttl_in],      kind: digital, off: 0 V, on: 5 V}
      laser_640:      {pin: ao9,  to: [laser_640/ttl_in],      kind: digital, off: 0 V, on: 5 V}
      lens_left:      {pin: ao1,  to: [left_tunable_lens/in],  kind: analog, limits: {V: [0, 5]}, park: 3.13 V}
      lens_right:     {pin: ao3,  to: [right_tunable_lens/in], kind: analog, limits: {V: [0, 5]}, park: 4.85 V}
      galvo_positive: {pin: ao26, to: [positive_galvo/in],     kind: analog, limits: {V: [-1, 1]}, park: 0 V}
      galvo_negative: {pin: ao27, to: [negative_galvo/in],     kind: analog, limits: {V: [-1, 1]}, park: 0 V}
      z_step:         {pin: ao5,  to: [z_axis/ttl_in],         kind: digital, off: 0 V, on: 5 V}

  devices:                                        # simulated drivers: swap each target for the driver of your hardware
    sim_wiring:                                   # plays the wires above for the simulated devices
      target: vxl.devices.simulated.SimulatedWiring
      init: {wiring: *wiring}

    nidaq_1:
      target: vxl.devices.signals.cards.simulated.SimulatedDaqmx
      init: {device_name: Dev3}

    ao_main:
      target: vxl.devices.signals.generator.simulated.SimulatedGenerator
      init: {hub: nidaq_1, wiring: sim_wiring}

    camera:                                       # a 151-megapixel sensor, as on exaSPIM
      target: vxl.devices.camera.simulated.SimulatedCamera
      init:
        wiring: sim_wiring
        frame_source: {sensor_size_px: {x: 14192, y: 10640}, pixel_size_um: {x: 3.76, y: 3.76}}

    laser_488:
      target: vxl.devices.light.simulated.SimulatedLaser
      init: {wavelength: 488}
    laser_561:
      target: vxl.devices.light.simulated.SimulatedLaser
      init: {wavelength: 561}
    laser_640:
      target: vxl.devices.light.simulated.SimulatedLaser
      init: {wavelength: 640}

    fw_emission:
      target: vxl.devices.axes.simulated.SimulatedDiscreteAxis
      init:
        slots: {"0": BP525, "1": BP600, "2": BP700}

    excitation_side_axis:                         # moves the mirror that picks the illumination arm
      target: vxl.devices.axes.simulated.SimulatedContinuousAxis
      init: {lower_limit: 0, upper_limit: 100, has_ttl_stepper: false}
    excitation_side_selector:                     # the same mirror, as 2 named positions
      target: vxl.devices.axes.discrete.MappedDiscreteAxis
      init:
        axis: excitation_side_axis
        tolerance: 1
        slots:
          "0": {label: left, position: 0}
          "1": {label: right, position: 100}

    x_axis: &stage
      target: vxl.devices.axes.continuous.simulated.SimulatedLinearAxis
      init:
        lower: 0
        upper: 50000
        speed: 10000
        wiring: sim_wiring
    y_axis: *stage
    z_axis: *stage
    left_focus: *stage
    right_focus: *stage
    camera_focus: *stage

  autosave:                                       # the properties that a change by a person saves in the active profile
    camera:    [exposure_time_ms, binning, pixel_format]

  stage:                                          # each specimen axis: its device, and where imaging can happen (µm)
    x: {device: x_axis}
    y: {device: y_axis}
    z: {device: z_axis}

  optics:                                         # where the light goes: light sources → specimen → detectors
    # Rule 1: to says where the light goes next. A list means "to all of these at once". Several nodes can point at 1 node.
    # Rule 2: what a part does to the light is in parts, not here.
    # Rule 3: a device that sends the light a different way at each position gives `to` for each position.
    # Rule 4: a device holds a part when 1 of its slot labels, in devices.<name>.init.slots, is the name of a part.

    laser_488:          {to: combiner}            # the 3 lasers point at 1 node: the beams join there
    laser_561:          {to: combiner}
    laser_640:          {to: combiner}
    combiner:           {to: excitation_side_selector}

    excitation_side_selector:                     # a device that sends the light to 1 arm at a time (to check: the real bench may split to both)
      to: {left: left_tunable_lens, right: right_tunable_lens}   # the node that gets the light at each position

    left_tunable_lens:  {to: positive_galvo}      # the wire lens_left drives it
    positive_galvo:     {to: left_focus}          # the wire galvo_positive drives it (its arm: to check)
    left_focus:         {to: specimen}            # a focus stage: a profile sets it in props

    right_tunable_lens: {to: negative_galvo}      # the wire lens_right drives it
    negative_galvo:     {to: right_focus}         # the wire galvo_negative drives it
    right_focus:        {to: specimen}

    specimen:           {to: objective}
    objective:          {to: camera_focus}
    camera_focus:       {to: fw_emission}         # a focus stage: a profile sets it in props

    fw_emission:                                  # it holds the filters that its slot labels name
      to: camera

    camera:             {width: {y: 1}, height: {x: -1}}   # no to: a detector. Width along +y, height along -x

  scan:                                           # how 1 capture runs. Only the choices: the rest follows from the wires
    axis: z                                       # the stage axis that 1 capture moves. X and Y are tiled
    motion: step                                  # step: move, stop, take the frame
    pacer: ao_main                                # what sets the rhythm: this device's own clock
    # Worked out from the wires, and shown by the check:
    #   ao_main   repeats on its own clock, 1 cycle for each frame
    #   camera    takes 1 frame on each pulse of ao_main.camera_trigger
    #   z_axis    takes 1 step of spacing on each pulse of ao_main.z_step

default:
  task:                                           # what a new task takes when it leaves these out
    overlap: {x: 10 %, y: 10 %}                   # 1 key for each tiled axis
    path:
      scan:  {z: forward}                         # the axis in rig.scan
      tiles: {kind: grid, axes: [{x: alternate}, {y: forward}]}
    iteration: position_major

  positions:                                      # the devices that the instrument sets, the same for every profile
    excitation_side_selector: {axis: x, order: [left, right], at: [20000], margin: 100}
    # it follows the stage along X: left below 20000 µm, right above. Within 100 µm of that point it keeps its side

  profiles:                                       # a profile is a mini instrument: what is on at the same moment, and all it needs to run
    gfp:
      label: GFP
      channels:                                   # each channel: its cameras, each with its light. Each camera reads its whole sensor: no fov
        gfp: {camera: laser_488}
      positions: {fw_emission: BP525}             # the devices that this profile sets, 1 value each
      power:                                      # the power of each laser and modulator that software sets
        laser_488: {full: 100 mW, dim: 10 mW}
      timelines:                                  # 1 for each signal generator that plays. Only the wires it plays
        ao_main:
          sample_rate: 10 kHz
          duration: 544 ms                        # 1 camera frame
          signals:
            camera_trigger: &camera {kind: on, start: {timeline: start, offset: 25 ms}, end: {timeline: start, offset: 136 ms}}
            laser_488:      &laser {kind: on, start: {timeline: start, offset: 15 ms}}
            lens_left:      &lens_left {kind: wave, shape: triangle, split: 1, center: 3.13 V, amplitude: 1.15 V}
            lens_right:     &lens_right {kind: constant, value: 4.85 V}
            galvo_positive: &galvo {kind: wave, shape: triangle, center: 0.005 V, amplitude: 0.005 V}
            galvo_negative: *galvo
            z_step:         &z_step {kind: on, end: {timeline: start, offset: 5.44 ms}}
      spacing: 1.0                                # µm between frames along the scan axis

    rfp:                                          # real profiles differ in focus, timing and signal size. Here they share values only because this is an example
      label: RFP
      channels:
        rfp: {camera: laser_561}
      positions: {fw_emission: BP600}
      power:                                      # the power of each laser and modulator that software sets
        laser_561: {full: 100 mW, dim: 10 mW}
      timelines:
        ao_main:
          sample_rate: 10 kHz
          duration: 544 ms
          signals:
            camera_trigger: *camera
            laser_561:      *laser
            lens_left:      *lens_left
            lens_right:     *lens_right
            galvo_positive: *galvo
            galvo_negative: *galvo
            z_step:         *z_step
      spacing: 1.0

    cy5:
      label: Cy5
      channels:
        cy5: {camera: laser_640}
      positions: {fw_emission: BP700}
      power:                                      # the power of each laser and modulator that software sets
        laser_640: {full: 100 mW, dim: 10 mW}
      timelines:
        ao_main:
          sample_rate: 10 kHz
          duration: 544 ms
          signals:
            camera_trigger: *camera
            laser_640:      *laser
            lens_left:      *lens_left
            lens_right:     *lens_right
            galvo_positive: *galvo
            galvo_negative: *galvo
            z_step:         *z_step
      spacing: 1.0

  writer:
    max_level: 3
    compression: blosc.lz4
