[project]
name = "barseq"
version = "0.1.0"
description = "BARSeq TDI line-scan acquisition built on Voxel's rigup, device, writer, and records libraries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vxl",
    "vxlib",
    "rigup",
    "vxl-records",
    "ome-zarr-writer",
    "numpy>=2.3.4",
    "pydantic>=2.11.9",
    "pyyaml>=6.0",
]

#[project.scripts]
#barseq = "barseq.cli:main"

[tool.uv.sources]
vxl = { path = "../..", editable = true }
vxlib = { path = "../../vxlib", editable = true }
rigup = { path = "../../rigup", editable = true }
vxl-records = { path = "../../records", editable = true }
ome-zarr-writer = { path = "../../omezarr", editable = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
