[project]
name = "vxl-catalog"
version = "0.1.0"
description = "Acquisition manifests and catalog models for Voxel"
readme = "README.md"
authors = [
    { name = "Walter Mwaniki", email = "walter.g.mwaniki@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cloudpathlib[s3]>=0.24.0",
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
