hal:
  nodes:
    primary:
      devices:
        nidaq_1:
          target: vxl.devices.daq.SimulatedDaqmx
          init:
            device_name: "MockDev1"
        ao_main:
          target: vxl.devices.daq.SimulatedSignalGenerator
          init:
            hub: nidaq_1
            ports:
              laser_405: ao0
              laser_488: ao1
              laser_561: ao2
              laser_640: ao3
              laser_730: ao7
              camera_1: ao4
              camera_2: ao5
        laser_405:
          target: &laser_target vxl.devices.laser.simulated.SimulatedLaser
          autosave: [source_power_setpoint_mw, output_level_percent]
          init:
            wavelength: 405
            source_enable_delay_s: 1
        laser_488:
          target: *laser_target
          autosave: [source_power_setpoint_mw, output_level_percent]
          init:
            wavelength: 488
            source_enable_delay_s: 1
        laser_561:
          target: *laser_target
          autosave: [source_power_setpoint_mw, output_level_percent]
          init:
            wavelength: 561
            source_enable_delay_s: 1
        laser_640:
          target: *laser_target
          autosave: [source_power_setpoint_mw, output_level_percent]
          init:
            wavelength: 640
            source_enable_delay_s: 1
        laser_730:
          target: vxl.devices.laser.simulated.SimulatedLaser
          autosave: [source_power_setpoint_mw, output_level_percent]
          init: { wavelength: 730, source_enable_delay_s: 1 }
        fw_detection_shared:
          target: &fw_target vxl.devices.axes.simulated.SimulatedDiscreteAxis
          init:
            slots:
              { 0: "Quad-DGRC", 1: "Dual-DR", 2: "Dual-GC", 3: "NIR-LP720" }
        fw_emission_cam1:
          target: *fw_target
          init:
            slots: { 0: "BP450", 1: "BP525", 2: "BP600", 3: "BP780" }
        fw_emission_cam2:
          target: *fw_target
          init:
            slots: { 0: "BP525", 1: "BP700", 2: "BP780" }
        excitation_side_axis:
          target: vxl.devices.axes.simulated.SimulatedContinuousAxis
          init: { lower_limit: 0, upper_limit: 100, has_ttl_stepper: false }
        excitation_selector_1:
          target: vxl.devices.axes.discrete.MappedDiscreteAxis
          init:
            axis: excitation_side_axis
            tolerance: 1
            slots:
              "0": { label: "left", position: 0 }
              "1": { label: "right", position: 100 }
        x_axis:
          target: &axis_target vxl.devices.axes.simulated.SimulatedContinuousAxis
          init: { lower_limit: 0, upper_limit: 36700 }
        y_axis:
          target: *axis_target
          init: { lower_limit: 0, upper_limit: 23000 }
        z_axis:
          target: *axis_target
          init: { lower_limit: 0, upper_limit: 50000, has_ttl_stepper: true }
      kind: subprocess

    node_1:
      devices:
        camera_1: &sim_camera
          target: vxl.devices.camera.simulated.SimulatedCamera
          autosave: [exposure_time_ms, binning, pixel_format]
          init:
            frame_source:
              sensor_size_px: "10640,14192"
              pixel_size_um: "3.76,3.76"
        detection_path_selector:
          target: vxl.devices.axes.simulated.SimulatedDiscreteAxis
          init:
            slots: { 0: "specimen", 1: "calibration" }
      kind: subprocess
    node_2:
      devices:
        camera_2: *sim_camera
        excitation_selector_2:
          target: vxl.devices.axes.simulated.SimulatedDiscreteAxis
          init:
            slots: { 0: "left", 1: "right" }
      kind: subprocess

  stage:
    x: x_axis
    y: y_axis
    z: z_axis

  detection:
    camera_1:
      filter_wheels: [fw_detection_shared, fw_emission_cam1]
      magnification: 8.0
      routing: [detection_path]
    camera_2:
      filter_wheels: [fw_detection_shared, fw_emission_cam2]
      magnification: 8.0
      routing: [detection_path]

  illumination:
    laser_405:
      routing: [excitation_side]
    laser_488:
      routing: [excitation_side]
    laser_561:
      routing: [excitation_side]
    laser_640:
      routing: [excitation_side]
    laser_730:
      routing: [excitation_side]

  optical_routing:
    detection_path:
      type: select
      routes:
        specimen:
          selectors:
            detection_path_selector: specimen
        calibration:
          selectors:
            detection_path_selector: calibration
    excitation_side:
      type: split-x
      routes:
        lower:
          label: Left illumination
          selectors:
            excitation_selector_1: left
            excitation_selector_2: left
        upper:
          label: Right illumination
          selectors:
            excitation_selector_1: right
            excitation_selector_2: right

default:
  routing:
    detection_path:
      selected: specimen
    excitation_side:
      threshold: 20000

  imaging:
    channels:
      dapi:
        detection: camera_1
        illumination: laser_405
        filters:
          fw_detection_shared: "Quad-DGRC"
          fw_emission_cam1: "BP450"
        desc: "DAPI nuclear stain using 405nm excitation"
        label: DAPI
        emission: 461
      gfp:
        detection: camera_2
        illumination: laser_488
        filters:
          fw_detection_shared: "Quad-DGRC"
          fw_emission_cam2: "BP525"
        desc: "Green fluorescent protein using 488nm excitation"
        label: GFP
        emission: 510
      rfp:
        detection: camera_1
        illumination: laser_561
        filters:
          fw_detection_shared: "Quad-DGRC"
          fw_emission_cam1: "BP600"
        desc: "Red fluorescent protein using 561nm excitation"
        label: RFP
        emission: 600
      cy5:
        detection: camera_2
        illumination: laser_640
        filters:
          fw_detection_shared: "Quad-DGRC"
          fw_emission_cam2: "BP700"
        desc: "Far-red Cy5 channel using 640nm excitation"
        label: Cy5
        emission: 670
      nir:
        detection: camera_1
        illumination: laser_730
        filters:
          fw_detection_shared: "NIR-LP720"
          fw_emission_cam1: "BP780"
        desc: "Near-infrared channel for iRFP/miRFP using 730nm excitation"
        label: NIR
        emission: 760

    profiles:
      dapi_gfp:
        channels: ["dapi", "gfp"]
        props:
          laser_405:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          laser_488:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
          camera_2: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Simultaneous DAPI (cam1) and GFP (cam2) imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: &camera_waveform_ch1
                type: pulse
                voltage: { min: 0.0, max: 5.0 }
                window: { min: 0.0, max: 0.95 }
              laser_405: &laser_waveform_ch1
                type: pulse
                voltage: { min: 0.0, max: 5.0 }
                window: { min: 0.1, max: 0.9 }
              camera_2: &camera_waveform_ch2
                type: pulse
                voltage: { min: 0.0, max: 5.0 }
                window: { min: 0.02, max: 0.97 }
              laser_488: &laser_waveform_ch2
                type: pulse
                voltage: { min: 0.0, max: 5.0 }
                window: { min: 0.12, max: 0.92 }
      dapi_cy5:
        channels: ["dapi", "cy5"]
        props:
          laser_405:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          laser_640:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
          camera_2: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Simultaneous DAPI (cam1) and Cy5 (cam2) imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: *camera_waveform_ch1
              laser_405: *laser_waveform_ch1
              camera_2: *camera_waveform_ch2
              laser_640: *laser_waveform_ch2
      gfp_rfp:
        channels: ["gfp", "rfp"]
        props:
          laser_488:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          laser_561:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_2: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Simultaneous GFP (cam2) and RFP (cam1) imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: *camera_waveform_ch1
              laser_561: *laser_waveform_ch1
              camera_2: *camera_waveform_ch2
              laser_488: *laser_waveform_ch2
      rfp_cy5:
        channels: ["rfp", "cy5"]
        props:
          laser_561:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          laser_640:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
          camera_2: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Simultaneous RFP (cam1) and Cy5 (cam2) imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: *camera_waveform_ch1
              laser_561: *laser_waveform_ch1
              camera_2: *camera_waveform_ch2
              laser_640: *laser_waveform_ch2
      single_dapi:
        channels: ["dapi"]
        props:
          laser_405:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single DAPI channel for nuclear staining"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: *camera_waveform_ch1
              laser_405: *laser_waveform_ch1
      single_gfp:
        channels: ["gfp"]
        props:
          laser_488:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_2: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single GFP channel imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_2: *camera_waveform_ch1
              laser_488: *laser_waveform_ch1
      single_rfp:
        channels: ["rfp"]
        props:
          laser_561:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single RFP channel imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: *camera_waveform_ch1
              laser_561: *laser_waveform_ch1
      single_cy5:
        channels: ["cy5"]
        props:
          laser_640:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_2: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single Cy5 far-red channel imaging"
        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_2: *camera_waveform_ch1
              laser_640: *laser_waveform_ch1
      single_nir:
        channels: ["nir"]
        props:
          laser_730:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera_1: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single NIR channel for iRFP/miRFP imaging"

        sync:
          ao_main:
            sample_rate: "100 kHz"
            duration: "0.2 s"
            rest_time: "0.05 s"
            waveforms:
              camera_1: *camera_waveform_ch1
              laser_730: *laser_waveform_ch1


  output:
    max_level: 3
    compression: blosc.lz4
