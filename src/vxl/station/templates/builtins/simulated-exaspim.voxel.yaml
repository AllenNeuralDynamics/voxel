hal:
  devices:
    ao_main:
      target: vxl.devices.daq.SimulatedSignalGenerator
      init:
        hub: nidaq_1
        ports:
          camera: ao21
          laser_488: ao17
          laser_561: ao13
          laser_640: ao9
          left_tunable_lens: ao1
          right_tunable_lens: ao3
          left_galvo_pos: ao26
          left_galvo_neg: ao27
          right_galvo_pos: ao28
          right_galvo_neg: ao29
          z_axis: ao5
    camera:
      target: vxl.devices.camera.simulated.SimulatedCamera
      autosave: [exposure_time_ms, binning, pixel_format]
      init:
        frame_source:
          asset: exaspim-786399-tile-000001-ch-488-z-10496-v1
    fw_emission:
      target: vxl.devices.axes.simulated.SimulatedDiscreteAxis
      init:
        slots: {"0": "BP525", "1": "BP600", "2": "BP700"}
    detection_path_selector:
      target: vxl.devices.axes.simulated.SimulatedDiscreteAxis
      init:
        slots: {"0": "specimen", "1": "calibration"}
    excitation_side_axis:
      target: vxl.devices.axes.simulated.SimulatedContinuousAxis
      init: {lower_limit: 0, upper_limit: 100, has_ttl_stepper: false}
    excitation_side_selector:
      target: vxl.devices.axes.discrete.MappedDiscreteAxis
      init:
        axis: excitation_side_axis
        tolerance: 1
        slots:
          "0": {label: "left", position: 0}
          "1": {label: "right", position: 100}
    laser_488:
      target: &laser_target vxl.devices.laser.simulated.SimulatedLaser
      autosave: [source_power_setpoint_mw, output_level_percent]
      init: {wavelength: 488, source_enable_delay_s: 1}
    laser_561:
      target: *laser_target
      autosave: [source_power_setpoint_mw, output_level_percent]
      init: {wavelength: 561, source_enable_delay_s: 1}
    laser_640:
      target: *laser_target
      autosave: [source_power_setpoint_mw, output_level_percent]
      init: {wavelength: 640, source_enable_delay_s: 1}
    x_axis:
      target: &linear_axis_target vxl.devices.axes.simulated.SimulatedContinuousAxis
      init: {lower_limit: 0, upper_limit: 40000}
    y_axis:
      target: *linear_axis_target
      init: {lower_limit: 0, upper_limit: 25000}
    z_axis:
      target: *linear_axis_target
      init: {lower_limit: 0, upper_limit: 50000, has_ttl_stepper: true}
    left_focus:
      target: *linear_axis_target
      init: {lower_limit: 0, upper_limit: 10000}
    right_focus:
      target: *linear_axis_target
      init: {lower_limit: 0, upper_limit: 10000}
    camera_focus:
      target: *linear_axis_target
      init: {lower_limit: 0, upper_limit: 10000}
    nidaq_1:
      target: vxl.devices.daq.SimulatedDaqmx
      init:
        device_name: "MockDev1"

  stage:
    x: x_axis
    y: y_axis
    z: z_axis

  detection:
    camera:
      aux_devices: [camera_focus]
      filter_wheels: [fw_emission]
      magnification: 5.0
      rotation_deg: 90
      routing: [detection_path]

  illumination:
    laser_488:
      aux_devices: [left_focus, right_focus]
      routing: [excitation_side]
    laser_561:
      aux_devices: [left_focus, right_focus]
      routing: [excitation_side]
    laser_640:
      aux_devices: [left_focus, right_focus]
      routing: [excitation_side]

  optical_routing:
    detection_path:
      type: select
      routes:
        specimen:
          selectors:
            detection_path_selector: specimen
        calibration:
          selectors:
            detection_path_selector: calibration
    excitation_side:
      type: split-x
      routes:
        lower:
          label: Left illumination
          selectors:
            excitation_side_selector: left
        upper:
          label: Right illumination
          selectors:
            excitation_side_selector: right

default:
  routing:
    detection_path:
      selected: specimen
    excitation_side:
      threshold: 20000

  imaging:
    channels:
      gfp:
        detection: camera
        illumination: laser_488
        filters: {fw_emission: "BP525"}
        desc: "GFP using 488nm excitation"
        label: GFP
        emission: 510
      rfp:
        detection: camera
        illumination: laser_561
        filters: {fw_emission: "BP600"}
        desc: "RFP using 561nm excitation"
        label: RFP
        emission: 600
      cy5:
        detection: camera
        illumination: laser_640
        filters: {fw_emission: "BP700"}
        desc: "Cy5 using 640nm excitation"
        label: Cy5
        emission: 670

    profiles:
      single_gfp:
        channels: ["gfp"]
        props:
          laser_488:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single GFP channel imaging"
        sync:
          ao_main:
            sample_rate: "10 kHz"
            duration: "544 ms"
            rest_time: "0 s"
            waveforms:
              camera: &camera_waveform
                type: pulse
                voltage: {min: 0.0, max: 5.0}
                window: {min: 0.045956, max: 0.25}
              laser_488: &laser_waveform
                type: pulse
                voltage: {min: 0.0, max: 5.0}
                window: {min: 0.027574, max: 1.0}
              left_tunable_lens: &left_tunable_lens_waveform
                type: triangle
                voltage: {min: 1.98, max: 4.28}
                window: {min: 0.0, max: 1.0}
                cycles: 1
                symmetry: 1.0
              right_tunable_lens: &right_tunable_lens_waveform
                type: triangle
                voltage: {min: 4.85, max: 4.851}
                window: {min: 0.0, max: 1.0}
                cycles: 1
                symmetry: 1.0
              left_galvo_pos: &left_galvo_pos_waveform
                type: triangle
                voltage: {min: -0.5, max: 0.5}
                window: {min: 0.0, max: 1.0}
                cycles: 1
                symmetry: 0.5
              left_galvo_neg: &left_galvo_neg_waveform
                type: derived
                operation: mirror
                source: left_galvo_pos
              right_galvo_pos: &right_galvo_pos_waveform
                type: triangle
                voltage: {min: -0.5, max: 0.5}
                window: {min: 0.0, max: 1.0}
                cycles: 1
                symmetry: 0.5
              right_galvo_neg: &right_galvo_neg_waveform
                type: derived
                operation: mirror
                source: right_galvo_pos
              z_axis: &z_axis_waveform
                type: pulse
                voltage: {min: 0.0, max: 5.0}
                window: {min: 0.0, max: 0.01}
      single_rfp:
        channels: ["rfp"]
        props:
          laser_561:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single RFP channel imaging"
        sync:
          ao_main:
            sample_rate: "10 kHz"
            duration: "544 ms"
            rest_time: "0 s"
            waveforms:
              camera: *camera_waveform
              laser_561: *laser_waveform
              left_tunable_lens: *left_tunable_lens_waveform
              right_tunable_lens: *right_tunable_lens_waveform
              left_galvo_pos: *left_galvo_pos_waveform
              left_galvo_neg: *left_galvo_neg_waveform
              right_galvo_pos: *right_galvo_pos_waveform
              right_galvo_neg: *right_galvo_neg_waveform
              z_axis: *z_axis_waveform
      single_cy5:
        channels: ["cy5"]
        props:
          laser_640:
            source_power_setpoint_mw: 100
            output_level_percent: 10
          camera: {pixel_format: MONO16, binning: 1, exposure_time_ms: 10}
        z_step: 1.0
        desc: "Single Cy5 channel imaging"

        sync:
          ao_main:
            sample_rate: "10 kHz"
            duration: "544 ms"
            rest_time: "0 s"
            waveforms:
              camera: *camera_waveform
              laser_640: *laser_waveform
              left_tunable_lens: *left_tunable_lens_waveform
              right_tunable_lens: *right_tunable_lens_waveform
              left_galvo_pos: *left_galvo_pos_waveform
              left_galvo_neg: *left_galvo_neg_waveform
              right_galvo_pos: *right_galvo_pos_waveform
              right_galvo_neg: *right_galvo_neg_waveform
              z_axis: *z_axis_waveform


  output:
    max_level: 3
    compression: blosc.lz4
