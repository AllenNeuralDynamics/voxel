[project]
name = "illumination-lab"
version = "0"
description = "Prototype of laser heads, modulators and channel lighting (internal workspace tooling; not built or published)"
requires-python = ">=3.13"
dependencies = ["vxl", "vxlib", "rigup"]

# Virtual member, as bench: run it as a module from the repo root, e.g. `uv run -m illumination_lab.demo`.
[tool.uv]
package = false

[tool.uv.sources]
vxl = { workspace = true }
vxlib = { workspace = true }
rigup = { workspace = true }
