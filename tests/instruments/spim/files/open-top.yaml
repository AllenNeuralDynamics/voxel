# Open-top light sheet in the new file shape: X sweeps, and the X stage's pulses set the rhythm.
# The objectives are below a glass plate at 45°, so each frame is a slanted slice. Each strip is 1 capture: a Y and Z position and an X sweep.
# A sketch from the design talk of 2026-11-10. This shape is for instruments with area cameras.
# Pins and numbers are examples. Filter bands are guesses to check.
# Hardware facts come from notes/platform/examples/_archive/open-top.yaml.

rig:
  model: open-top light sheet
  target: vxl.instruments.spim.Microscope

  parts:                                          # things with no driver: their facts, and their class when it is not rigup.Part
    combiner:    {kind: combiner}
    sheet_galvo: {kind: galvo}
    objective:   {target: vxl.parts.Objective, magnification: 16.7}   # 6.5 µm ÷ 16.7 = 0.39 µm per pixel in the sample
    BP525:       {target: vxl.parts.Filter, band: [500 nm, 550 nm]}
    LP650:       {target: vxl.parts.Filter, band: [650 nm, null]}    # a long-pass filter: open at the top

  devices:
    nidaq_1:
      target: vxl.devices.signals.cards.ni.NiDaqmx
      init: {device_name: Dev1, product: PCIe-6738}

    ao_main:
      target: vxl.devices.signals.generator.ni.NiGenerator
      init: {hub: nidaq_1}

    camera:
      target: vxl_drivers.cameras.dcam.hamamatsu.HamamatsuCamera   # ORCA-Flash4.0: 2048 × 2048 px
      init: {pixel_size_um: {x: 6.5, y: 6.5}, serial: "000123"}

    laser_488:
      target: vxl.devices.light.simulated.SimulatedLaser
      init: {wavelength: 488}
    laser_638:
      target: vxl.devices.light.simulated.SimulatedLaser
      init: {wavelength: 638}

    fw_emission:
      target: vxl.devices.axes.simulated.SimulatedDiscreteAxis
      init:
        slots: {"0": BP525, "1": LP650}

    tiger_controller:
      target: vxl_drivers.tigerhub.TigerHub
      init: {box: COM4}
    x_axis:
      target: vxl_drivers.axes.asi.TigerLinearAxis
      init: {hub: tiger_controller, axis_label: x, units: um}
    y_axis:
      target: vxl_drivers.axes.asi.TigerLinearAxis
      init: {hub: tiger_controller, axis_label: y, units: um}
    z_axis:
      target: vxl_drivers.axes.asi.TigerLinearAxis
      init: {hub: tiger_controller, axis_label: z, units: um}

  autosave:                                       # the properties that a change by a person saves in the active profile
    camera:    [exposure_time_ms]

  stage: {x: x_axis, y: y_axis, z: z_axis}        # the device that drives each axis
  # z_axis: this motor counts up as the sample goes up, but +z is deeper: its direction will be set on the device

  wiring:                                         # every wire on the bench, grouped by the device that sends it
    ao_main:
      camera_trigger: {pin: ao0, to: [camera/trigger_in],   kind: digital, off: 0 V, on: 5 V}
      laser_488:      {pin: ao1, to: [laser_488/ttl_in],    kind: digital, off: 0 V, on: 5 V}
      laser_638:      {pin: ao2, to: [laser_638/ttl_in],    kind: digital, off: 0 V, on: 5 V}
      galvo_sheet:    {pin: ao3, to: [sheet_galvo/in],      kind: analog, limits: {V: [-2, 2]}, park: 0 V}   # scans the beam to make the sheet
    x_axis:
      x_pulse:        {pin: ttl_out, to: [ao_main/pfi0], kind: digital}   # 1 pulse every spacing while X sweeps

  optics:                                         # where the light goes: light sources → sample → detectors
    # Rule 1: to says where the light goes next. A list means "to all of these at once". Several nodes can point at 1 node.
    # Rule 2: what a part does to the light is in parts, not here.
    # Rule 3: a device that sends the light a different way at each position gives `to` for each position.
    # Rule 4: a device holds a part when 1 of its slot labels, in devices.<name>.init.slots, is the name of a part.

    laser_488:   {to: combiner}                   # the 2 lasers point at 1 node: the beams join there
    laser_638:   {to: combiner}
    combiner:    {to: sheet_galvo}
    sheet_galvo: {to: sample}                     # the wire galvo_sheet drives it: it scans the beam into a sheet

    sample:      {to: objective}
    objective:   {to: fw_emission}

    fw_emission:                                  # it holds the filters that its slot labels name
      to: camera

    camera:      {width: {y: 1}, height: {x: 1, z: 1}}   # no to: a detector. Width along +y; height at 45° between +x and +z

  scan:                                           # how 1 capture runs. Only the choices: the rest follows from the wires
    axis: x                                       # the stage axis that 1 capture moves. Y and Z are tiled
    motion: sweep                                 # sweep: take frames while moving
    pacer: x_axis                                 # what sets the rhythm: this stage's pulses, 1 every spacing
    margin: 5 %                                   # X runs 5 % slower than spacing ÷ duration, so no pulse comes before a frame ends
    # Worked out from the wires, and shown by the check:
    #   x_axis    sweeps, and sends 1 pulse every spacing on x_axis.x_pulse
    #   ao_main   plays 1 cycle on each pulse of x_axis.x_pulse
    #   camera    takes 1 frame on each pulse of ao_main.camera_trigger

default:
  task:                                           # what a new task takes when it leaves these out
    overlap: {y: 10 %, z: 15 %}                   # 1 key for each tiled axis
    path:
      scan:  {x: alternate}                       # the axis in rig.scan
      tiles: {kind: grid, axes: [{y: alternate}, {z: forward}]}
    iteration: position_major

  profiles:                                       # a profile is a mini instrument: what is on at the same moment, and all it needs to run
    gfp:
      label: GFP
      channels:                                   # 1 entry for each camera that is on: its light and the region it reads out
        camera: {illumination: laser_488, fov: {x: 0, y: 0, w: 2048, h: 2048}}   # the height is about 800 µm: 565 µm deep and 565 µm along X
      positions: {fw_emission: BP525}             # the devices that this profile sets, 1 value each
      power:                                      # the power of each laser and modulator that software sets
        laser_488: {full: 50 mW}
      timelines:                                  # 1 for each signal generator that plays. Only the wires it plays
        ao_main:
          sample_rate: 100 kHz
          duration: 10 ms                         # 1 camera frame
          signals:
            camera_trigger: &camera {kind: on, end: {timeline: start, offset: 1 ms}}
            laser_488:      &laser {kind: on}
            galvo_sheet:    &galvo {kind: wave, shape: triangle, cycles: 20, center: 0 V, amplitude: 1.2 V}
      spacing: 0.5                                # µm between frames along the scan axis. X speed = 0.5 µm ÷ 10 ms × 0.95 = 47.5 µm/s

    cy5:                                          # real profiles differ in focus, timing and signal size. Here they share values only because this is an example
      label: Cy5
      channels:
        camera: {illumination: laser_638, fov: {x: 0, y: 0, w: 2048, h: 2048}}
      positions: {fw_emission: LP650}
      power:                                      # the power of each laser and modulator that software sets
        laser_638: {full: 50 mW}
      timelines:
        ao_main:
          sample_rate: 100 kHz
          duration: 10 ms
          signals:
            camera_trigger: *camera
            laser_638:      *laser
            galvo_sheet:    *galvo
      spacing: 0.5

  writer:
    max_level: 3
    compression: blosc.lz4
