[project]
name = "rigup"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Walter Mwaniki", email = "walter.g.mwaniki@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "msgpack>=1.0.0",
    "pydantic>=2.12.0",
    "pyzmq>=27.1.0",
    # pyzmq's asyncio sockets need add_reader, which the Windows Proactor loop lacks; with tornado
    # installed pyzmq bridges it on a selector thread (Proactor is still required for subprocess nodes).
    "tornado>=6.1; sys_platform == 'win32'",
    "vxlib",
]

[project.scripts]
rigup-node = "rigup.node:run_node"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
