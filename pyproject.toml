[project]
name = "vxl"
version = "0.1.0"
description = "Light sheet microscopy configuration, orchestration, and acquisition"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Walter Mwaniki", email = "walter.g.mwaniki@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["voxel", "microscopy", "light-sheet", "neuroscience", "rigup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: System :: Hardware",
]

dependencies = [
    "rigup",
    "vxlib",
    "vxl-records",
    "msgpack>=1.1.0",
    "numpy>=2.3.4",
    "numcodecs>=0.16.5",
    "ome-zarr-writer[ts,s3]",
    "opencv-python-headless>=4.11.0.86",
    "psutil>=5.9",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.13.1",
    "rich>=15.0.0",
    "cloudpathlib[s3]>=0.24.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "nidaqmx>=1.3.0",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.121.1",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
    "uvloop; platform_system != 'Windows'",
]
qt = [
    "PySide6>=6.8.0",
    "qasync>=0.27.1",
    "qtawesome>=1.4.0",
]

[project.scripts]
vxl = "vxl.cli:main"
voxel = "vxl.cli:main"

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/voxel"
Issues = "https://github.com/AllenNeuralDynamics/voxel/issues"

[project.entry-points."vxl.instrument.metadata"]
exaspim = "vxl.instrument.metadata.ExaspimMetadata"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "rigup",
    "drivers",
    "vxlib",
    "omezarr",
    "bench",
    "records",
]

[tool.uv.sources]
ome-zarr-writer = { workspace = true }
rigup = { workspace = true }
vxlib = { workspace = true }
vxl-records = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.20.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
norecursedirs = ["notes"]
testpaths = [
    "tests",
    "drivers/tests",
    "omezarr/tests",
    "records/tests",
    "rigup/tests",
]
markers = [
    "slow: integration-flavored tests (ZMQ networking, zarr I/O); excluded from pre-push, run in CI",
]

[tool.pyright]
typeCheckingMode = "standard"
ignore = [
    "**/sdk/**",
    "**/vendor/**",
    "**/bench/**/analysis.py",  # marimo notebooks: cells end in a bare expression to display a widget
]
